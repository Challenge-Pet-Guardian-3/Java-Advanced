spring.application.name=pet-guardian

spring.h2.console.enabled=true

# Banco persistido em arquivo — sobrevive a restart do servidor
spring.datasource.url=jdbc:h2:file:./data/petguardian;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

info.app.name=Pet Guardian
info.app.description=API para o projeto PetGuardian
info.app.version=1.0.0

management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=always

spring.jpa.show-sql=true

springdoc.swagger-ui.operationsSorter=method

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Força UTF-8 nas respostas HTTP (corrige acentos corrompidos tipo "PraÃ§a")
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true