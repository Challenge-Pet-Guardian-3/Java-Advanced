# ==========================================================
# 1. APLICAÇÃO E SERVIDOR
# ==========================================================
spring.application.name=pet-guardian
server.port=8080

# Força codificação UTF-8 nas requisições e respostas HTTP
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Tratamento e ocultação de detalhes de erro em produção
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# ==========================================================
# 2. BANCO DE DADOS H2 (Persistido em arquivo)
# ==========================================================
# Salva os dados em ./data/petguardian.mv.db e aceita sintaxe MySQL (AUTO_INCREMENT)
spring.datasource.url=jdbc:h2:file:./data/petguardian;AUTO_SERVER=TRUE;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (Acesse em: http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ==========================================================
# 3. JPA / HIBERNATE
# ==========================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# 'validate' garante que o Flyway comanda a criação das tabelas e o JPA apenas valida
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================================
# 4. FLYWAY MIGRATIONS
# ==========================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ==========================================================
# 5. SWAGGER / OPENAPI (Documentação da API)
# ==========================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ==========================================================
# 6. ACTUATOR & MONITORAMENTO
# ==========================================================
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=always

info.app.name=Pet Guardian
info.app.description=API para o projeto PetGuardian
info.app.version=1.0.0