spring.application.name=pet-guardian

# PostgreSQL (Compatível com Docker local e Railway)
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:petguardian}
spring.datasource.username=${PGUSER:petguardian}
spring.datasource.password=${PGPASSWORD:petguardian}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Actuator / Info
info.app.name=Pet Guardian
info.app.description=API para o projeto PetGuardian
info.app.version=1.0.0

management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=always

# Misc
spring.jpa.show-sql=true
springdoc.swagger-ui.operationsSorter=method

# RSA Keys (JWT)
rsa.private-key=classpath:keys/private_key.pem
rsa.public-key=classpath:keys/public_key.pem

#server.port=8091
