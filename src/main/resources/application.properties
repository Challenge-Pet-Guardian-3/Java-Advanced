# ==========================================================
# 1. APLICAÇÃO E SERVIDOR
# ==========================================================
spring.application.name=pet-guardian
server.port=8080

# Força codificação UTF-8 nas requisições e respostas HTTP
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Tratamento e ocultação de detalhes de erro em produção
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# ==========================================================
# 2. BANCO DE DADOS H2 (Em arquivo — persiste entre execuções)
# ==========================================================
# Em arquivo: os dados sobrevivem ao restart da aplicação (usuário, pets, tarefas etc.
# continuam lá no próximo "run"). O Flyway só aplica migrations novas (a tabela de
# histórico dele já sabe o que rodou antes). AUTO_SERVER=TRUE permite abrir o H2 Console
# em paralelo com a aplicação rodando, sem travar o arquivo.
# O arquivo fica em ./data/petguardian.mv.db na raiz do projeto — adicione "data/" ao
# .gitignore para não versionar o banco local.
spring.datasource.url=jdbc:h2:file:./data/petguardian;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (Acesse em: http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ==========================================================
# 3. JPA / HIBERNATE
# ==========================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# 'validate' garante que o Flyway comanda a criação das tabelas e o JPA apenas valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================================
# 4. FLYWAY MIGRATIONS
# ==========================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ==========================================================
# 5. SWAGGER / OPENAPI (Documentação da API)
# ==========================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ==========================================================
# 6. ACTUATOR & MONITORAMENTO
# ==========================================================
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=always

info.app.name=Pet Guardian
info.app.description=API para o projeto PetGuardian
info.app.version=1.0.0

# ==========================================================
# 7. SEGURANÇA / JWT
# ==========================================================
# Chave usada para assinar e validar os tokens JWT (HMAC-SHA).
# Precisa ter pelo menos 32 caracteres (256 bits) para o algoritmo HS256.
jwt.secret=petguardian-chave-secreta-usada-para-assinar-o-jwt-32bytes